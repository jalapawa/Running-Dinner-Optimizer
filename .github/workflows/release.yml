name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller RunningDinnerOptimizer.spec

      - name: Package
        run: tar -czf RunningDinnerOptimizer-linux.tar.gz -C dist RunningDinnerOptimizer

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RunningDinnerOptimizer-linux.tar.gz
          generate_release_notes: true
